name: Deploy

on:
  workflow_run:
    workflows: [ Build and Test ]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:

jobs:
  none:
    name: Deploy to WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Get Run ID
        id: get-run-id
        run: |
          RUN_ID=`gh run --repo ${{ github.repository }} list --workflow "Build and Test" --json databaseId --jq .[0].databaseId`
          echo "Detected latest run id of ${RUN_ID} for workflow buildandtest"
          echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          github-token: ${{ github.token }}
          run-id: ${{ steps.get-run-id.outputs.run-id }}
          path: build/WebGL
      - name: push build
        run: |
          ls -la
          git clone https://github.com/tuvus/tuvus.github.io.git
          cd tuvus.github.io
          git config --unset-all http.https://github.com/.extraheader
          git config user.name "WebGLDeployer"
          git checkout -b "deployversion"
          rm -rf Build/
          cp ../build/WebGL/Build Build/
          git add Build/
          git remote -v
          git push --set-upstream origin deployversion
          git push
